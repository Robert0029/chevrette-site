<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chevrette — Referral Invite</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=202610031200">
<style>
  .ref-hero{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    overflow:hidden;
    padding:140px 0 60px;
  }
  .ref-bg{
    position:absolute;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 900px 520px at 50% -8%, rgba(255,31,112,.12), transparent 60%),
      radial-gradient(ellipse 700px 440px at 90% 100%, rgba(139,92,246,.14), transparent 60%),
      linear-gradient(180deg,#030305 0%, #030305 70%, #08060D 100%);
  }
  .ref-horn{
    position:absolute;
    top:-120px; right:-180px;
    width:900px;
    max-width:none;
    opacity:.5;
    z-index:0;
    pointer-events:none;
  }
  .ref-inner{
    position:relative;
    z-index:1;
    width:100%;
  }
  .ref-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:64px;
    align-items:center;
  }
  .ref-brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
    font-size:18px;
    letter-spacing:-.01em;
    margin-bottom:36px;
  }
  .ref-brand img{width:30px;height:30px;border-radius:8px;}
  .ref-card h1{
    max-width:520px;
    font-size:clamp(30px,4vw,44px);
    margin:18px 0 14px;
  }
  .ref-card p.lede{margin-bottom:0;}
  .ref-code-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px 22px;
    margin:32px 0 40px;
    max-width:420px;
  }
  .ref-code-box .code-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-tertiary);
    display:block;
    margin-bottom:4px;
  }
  .ref-code-box span.code-val{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    font-family:var(--font-display);
  }
  .ref-code-box button{
    background:transparent;
    border:1px solid var(--gray700);
    color:var(--white);
    border-radius:var(--radius-pill);
    padding:10px 18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    font-family:var(--font-display);
    transition:border-color .25s ease,transform .25s ease,box-shadow .25s ease;
    flex:none;
  }
  .ref-code-box button:hover{border-color:var(--pink-500);box-shadow:0 0 0 1px rgba(255,31,112,.12) inset;transform:translateY(-1px);}
  .ref-code-box button.copied{background:linear-gradient(135deg,var(--pink-500),var(--violet-500));color:#fff;border-color:transparent;}

  .ref-steps{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin:0 0 40px;
    padding:0;
    max-width:460px;
  }
  .ref-steps li{
    list-style:none;
    display:flex;
    align-items:flex-start;
    gap:16px;
  }
  .ref-step-num{
    flex:none;
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid rgba(255,31,112,.35);
    background:var(--black);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:13px;
    margin-top:1px;
    color:var(--pink-300);
    box-shadow:0 0 12px -4px var(--pink-glow);
  }
  .ref-steps p{
    font-size:14.5px;
    line-height:1.6;
    color:var(--text-secondary);
    margin:6px 0 0;
  }

  .ref-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .ref-note{margin-top:20px;font-size:12.5px;color:var(--text-tertiary);}

  .ref-showcase{display:flex;justify-content:center;}
  .ref-phone{
    width:250px;
  }
  .ref-back{
    display:inline-block;
    margin-top:44px;
    font-size:13px;
    font-weight:600;
    color:var(--text-tertiary);
    border-bottom:1px solid var(--gray700);
    padding-bottom:2px;
    transition:color .25s ease,border-color .25s ease;
  }
  .ref-back:hover{color:var(--white);border-color:var(--gray400);}

  @media (max-width:900px){
    .ref-grid{grid-template-columns:1fr;gap:40px;}
    .ref-showcase{order:-1;}
    .ref-phone{width:190px;}
    .ref-hero{padding:120px 0 60px;}
  }
</style>
</head>
<body>
<section class="ref-hero">
  <div class="ref-bg"></div>
  <img src="/assets/horn-line.svg" class="ref-horn" alt="" aria-hidden="true">
  <div class="container ref-inner">
    <div class="ref-grid" id="refGrid">
      <!-- filled by JS -->
    </div>
  </div>
</section>

<script>
(function(){
  var lang = ((navigator.language || "").toLowerCase().indexOf("ru") === 0) ? "ru" : "en";

  // Preferred: code comes in as a query param (?code=...), which survives
  // any server-side redirect intact. Falls back to the old path-based
  // parsing (/r/CODE or /referral/page.html/CODE) only if no query param
  // is present, for backward compatibility with any already-shared links.
  var code = "";
  try {
    code = new URLSearchParams(window.location.search).get("code") || "";
  } catch (e) {}

  if (!code) {
    var parts = window.location.pathname.split("/").filter(Boolean);
    var last = parts.length ? decodeURIComponent(parts[parts.length - 1]) : "";
    // Guard against picking up "page" or "page.html" from the referral
    // page's own URL when it's reached without a code at all.
    if (last && !/^page(\.html)?$/i.test(last) && last !== "referral") {
      code = last;
    }
  }

  // Basic sanity check: referral codes are short alphanumeric strings.
  var valid = /^[A-Za-z0-9]{4,20}$/.test(code);

  var grid = document.getElementById("refGrid");

  var t = {
    en: {
      eyebrow: "Referral Invite",
      title: "You've been invited to Chevrette",
      body: "Install the app, then paste this code on the sign-up screen (referral code field) to link your accounts.",
      codeLabel: "Your invite code",
      copy: "Copy",
      copied: "Copied",
      step1t: "Get the app",
      step1: "Install the Chevrette app from Google Play.",
      step2t: "Create your account",
      step2: "Open the app and start creating your account.",
      step3t: "Enter the code",
      step3: "On the sign-up screen, paste the code into the \u201cReferral code (optional)\u201d field.",
      cta: "Get it on Google Play",
      note: "Free to use. Available on Google Play.",
      back: "\u2190 Back to chevrette",
      badEyebrow: "Invalid Invite",
      badTitle: "This invite link isn't quite right",
      badBody: "This referral link looks incomplete or incorrect. You can still get the app and enter a code manually from the Profile screen of whoever invited you."
    },
    ru: {
      eyebrow: "Реферальное приглашение",
      title: "Вас пригласили в Chevrette",
      body: "Установите приложение, затем вставьте этот код на экране регистрации (поле «Реферальный код»), чтобы привязать аккаунты.",
      codeLabel: "Ваш код приглашения",
      copy: "Скопировать",
      copied: "Скопировано",
      step1t: "Установите приложение",
      step1: "Установите приложение Chevrette из Google Play.",
      step2t: "Создайте аккаунт",
      step2: "Откройте приложение и начните регистрацию.",
      step3t: "Введите код",
      step3: "На экране регистрации вставьте код в поле «Реферальный код (необязательно)».",
      cta: "Открыть в Google Play",
      note: "Бесплатно. Доступно в Google Play.",
      back: "\u2190 На главную chevrette",
      badEyebrow: "Ссылка недействительна",
      badTitle: "Что-то не так с этой ссылкой",
      badBody: "Похоже, эта реферальная ссылка неполная или неверная. Вы всё ещё можете установить приложение и ввести код вручную — его можно взять у того, кто вас пригласил, на экране «Профиль»."
    }
  }[lang];

  var downloadIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3.5v17a.5.5 0 0 0 .76.43l14-8.5a.5.5 0 0 0 0-.86l-14-8.5A.5.5 0 0 0 5 3.5z"/></svg>';

  if (valid) {
    grid.innerHTML =
      '<div class="ref-card">' +
        '<div class="ref-brand"><img src="/assets/icons/icon-192.png" alt=""><span>Chevrette</span></div>' +
        '<span class="eyebrow">' + t.eyebrow + '</span>' +
        '<h1>' + t.title + '</h1>' +
        '<p class="lede">' + t.body + '</p>' +
        '<div class="ref-code-box">' +
          '<div><span class="code-label">' + t.codeLabel + '</span><span class="code-val">' + code + '</span></div>' +
          '<button id="copyBtn" type="button">' + t.copy + '</button>' +
        '</div>' +
        '<ol class="ref-steps">' +
          '<li><span class="ref-step-num">1</span><div><strong>' + t.step1t + '</strong><p>' + t.step1 + '</p></div></li>' +
          '<li><span class="ref-step-num">2</span><div><strong>' + t.step2t + '</strong><p>' + t.step2 + '</p></div></li>' +
          '<li><span class="ref-step-num">3</span><div><strong>' + t.step3t + '</strong><p>' + t.step3 + '</p></div></li>' +
        '</ol>' +
        '<div class="ref-actions">' +
          '<a class="btn btn-primary btn-lg" href="https://play.google.com/store/apps/details?id=com.chevrette.app&amp;pcampaignid=web_share" target="_blank" rel="noopener">' + downloadIcon + '<span>' + t.cta + '</span></a>' +
        '</div>' +
        '<p class="ref-note">' + t.note + '</p>' +
        '<a class="ref-back" href="/index.html">' + t.back + '</a>' +
      '</div>' +
      '<div class="ref-showcase">' +
        '<div class="phone ref-phone">' +
          '<div class="phone-frame"><div class="notch"></div>' +
            '<div class="phone-screen has-image"><img src="/assets/screenshots/referral-v2.jpg" alt="Chevrette referral screen"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById("copyBtn").addEventListener("click", function(){
      var btn = this;
      navigator.clipboard.writeText(code).then(function(){
        btn.textContent = t.copied;
        btn.classList.add("copied");
        setTimeout(function(){ btn.textContent = t.copy; btn.classList.remove("copied"); }, 1500);
      });
    });
  } else {
    grid.innerHTML =
      '<div class="ref-card" style="grid-column:1 / -1;max-width:520px;">' +
        '<div class="ref-brand"><img src="/assets/icons/icon-192.png" alt=""><span>Chevrette</span></div>' +
        '<span class="eyebrow">' + t.badEyebrow + '</span>' +
        '<h1>' + t.badTitle + '</h1>' +
        '<p class="lede">' + t.badBody + '</p>' +
        '<div class="ref-actions" style="margin-top:32px;">' +
          '<a class="btn btn-primary btn-lg" href="https://play.google.com/store/apps/details?id=com.chevrette.app&amp;pcampaignid=web_share" target="_blank" rel="noopener">' + downloadIcon + '<span>' + t.cta + '</span></a>' +
        '</div>' +
        '<a class="ref-back" href="/index.html">' + t.back + '</a>' +
      '</div>';
  }
})();
</script>
</body>
</html>
